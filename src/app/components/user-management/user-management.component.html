<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>User Management</h2>
    <button (click)="isCreating = true" class="btn btn-primary">Create User</button>
  </div>

  <div *ngIf="isCreating || isEditing" class="card mb-4">
    <div class="card-body">
      <h3 class="card-title">{{ isEditing ? 'Edit User' : 'Create User' }}</h3>
      <form [formGroup]="userForm" (ngSubmit)="isEditing ? updateUser() : createUser()">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" formControlName="email">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" formControlName="password"
            [placeholder]="isEditing ? 'Leave blank to keep existing password' : ''">
        </div>
        <div class="mb-3">
          <label class="form-label">Roles</label>
          <div *ngFor="let role of roles" class="form-check">
            <input
              type="checkbox"
              class="form-check-input"
              [value]="role"
              (change)="onRoleChange($event)"
              [checked]="userForm.get('roles')?.value.includes(role)"
            />
            <label class="form-check-label">{{ role }}</label>
          </div>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid">Save</button>
          <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Email</th>
          <th>Roles</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.email }}</td>
          <td>{{ user.roles}}</td>
          <td>
            <div class="btn-group">
              <button (click)="editUser(user)" class="btn btn-sm btn-warning me-1">Edit</button>
              <button (click)="deleteUser(user.id)" class="btn btn-sm btn-danger">Delete</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
