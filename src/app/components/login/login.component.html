<div class="login-container">
  <div class="login-card">
    <h2>Login</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          [class.is-invalid]="email?.invalid && email?.touched"
          placeholder="Enter your email"
        >
        <div class="invalid-feedback" *ngIf="email?.errors?.['required'] && email?.touched">
          Email is required
        </div>
        <div class="invalid-feedback" *ngIf="email?.errors?.['email'] && email?.touched">
          Please enter a valid email address
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          [class.is-invalid]="password?.invalid && password?.touched"
          placeholder="Enter your password"
        >
        <div class="invalid-feedback" *ngIf="password?.errors?.['required'] && password?.touched">
          Password is required
        </div>
      </div>

      <div class="alert alert-danger" *ngIf="error">
        {{ error }}
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>
    </form>
  </div>
</div>

<app-change-password-modal
  *ngIf="showChangePasswordModal"
  (passwordChanged)="onPasswordChanged()"
  (closeModal)="onCloseModal()"
></app-change-password-modal>
